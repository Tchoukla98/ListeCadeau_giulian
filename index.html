<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listes de Cadeaux — Anniversaire & Noël</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      transition: background-color 0.4s ease;
    }
    .theme-birthday {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fde68a 100%);
    }
    .theme-christmas {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 45%, #dcfce7 100%);
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="theme-christmas min-h-screen text-slate-800 pb-16">

  <!-- BANNIÈRE MODE DÉMO (masquée automatiquement dès que Firebase est actif) -->
  <div id="demoBanner" class="bg-amber-600 text-white text-xs sm:text-sm py-2 px-4 text-center font-semibold shadow-sm">
    ⚠️ Mode Démonstration (sauvegarde locale sur cet appareil).
  </div>

  <!-- HEADER -->
  <header class="max-w-5xl mx-auto px-4 pt-6 pb-4">
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg p-5 sm:p-7 border border-white/60">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <span id="connectionBadge" class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-800 mb-2">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Connexion...
          </span>
          <h1 id="mainTitle" class="text-2xl sm:text-4xl font-black tracking-tight text-slate-900">
            🎅 Liste de Noël
          </h1>
          <p id="mainSubtitle" class="text-slate-500 text-sm sm:text-base mt-1">
            Choisissez un cadeau pour éviter les doublons — modifiable à tout moment !
          </p>
        </div>

        <!-- BOUTONS PARENTS / CONFIDENTIALITÉ -->
        <div class="flex flex-wrap items-center gap-2">
          <button id="toggleNamesBtn" onclick="toggleHideNames()" class="text-xs sm:text-sm font-bold px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1.5" title="Masquer ou afficher qui a réservé quoi">
            👁️ <span id="toggleNamesLabel">Masquer les prénoms</span>
          </button>
          <button id="parentModeBtn" onclick="handleParentAuth()" class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white transition flex items-center gap-1.5 shadow-sm">
            🔒 <span id="parentBtnLabel">Mode Parents</span>
          </button>
        </div>
      </div>

      <!-- SÉLECTEUR DES 2 LISTES (ONGLETS) -->
      <div class="grid grid-cols-2 gap-3 mt-6 bg-slate-100/90 p-1.5 rounded-2xl">
        <button id="tab-christmas" onclick="switchList('christmas')" class="py-3 px-4 rounded-xl font-extrabold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-red-600 text-white shadow-md">
          <span>🎅</span>
          <span>Liste de Noël</span>
          <span id="count-christmas" class="ml-1 text-xs px-2 py-0.5 rounded-full bg-white/25">0</span>
        </button>
        <button id="tab-birthday" onclick="switchList('birthday')" class="py-3 px-4 rounded-xl font-extrabold text-sm sm:text-base transition-all flex items-center justify-center gap-2 text-slate-600 hover:bg-white/60">
          <span>🎂</span>
          <span>Anniversaire</span>
          <span id="count-birthday" class="ml-1 text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0</span>
        </button>
      </div>

      <!-- BARRE DE PROGRESSION & FILTRES -->
      <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex-1">
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1.5">
            <span id="progressText">0 réservé sur 0 cadeaux</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3
